<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Final - DevSecOps</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .team-section {
            text-align: left;
            background: rgba(15, 23, 42, 0.6);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #38bdf8;
        }
        .team-section h3 {
            margin-top: 0;
            color: #e2e8f0;
        }
        ul {
            margin: 0;
            padding-left: 20px;
            color: #cbd5e1;
        }
        li {
            margin: 8px 0;
            font-size: 1rem;
        }
        .badge {
            display: inline-block;
            background: #0284c7;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🚀 Proyecto Final DevSecOps</h1>
        <p class="subtitle">Pipeline CI/CD Automatizado con GitHub Actions & AWS</p>

        <div class="team-section">
            <h3>👥 Integrantes del Equipo:</h3>
            <ul>
                <li>Nombre del Integrante 1</li>
                <li>Nombre del Integrante 2</li>
                <li>Nombre del Integrante 3</li>
                <li>Nombre del Integrante 4</li>
                <li>Nombre del Integrante 5</li>
            </ul>
        </div>

        <div class="badge">Ambiente Desplegado OK</div>
    </div>

</body>
</html>
