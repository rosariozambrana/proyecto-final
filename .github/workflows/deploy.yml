name: Continuous Deployment (Blue-Green)

on:
  push:
    branches:
      - release

jobs:
  deploy-cicd-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Build Project
        run: ./mvnw clean package -DskipTests

      - name: Deploy to CI/CD Server (Test)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.CICD_SERVER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "target/webapi-0.0.1-SNAPSHOT.jar,scripts/deploy.sh"
          target: "/home/${{ secrets.SSH_USER }}/app"

      - name: Execute Remote Deploy Script on CI/CD Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CICD_SERVER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/${{ secrets.SSH_USER }}/app
            cd /home/${{ secrets.SSH_USER }}/app
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh

  deploy-app-server:
    needs: deploy-cicd-server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Build Project
        run: ./mvnw clean package -DskipTests

      - name: Deploy to Production AppServer
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.APP_SERVER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "target/webapi-0.0.1-SNAPSHOT.jar,scripts/deploy.sh"
          target: "/home/${{ secrets.SSH_USER }}/app"

      - name: Execute Remote Deploy Script on AppServer
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.APP_SERVER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/${{ secrets.SSH_USER }}/app
            cd /home/${{ secrets.SSH_USER }}/app
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh